name: TSAN

on:
  schedule:
    # Nightly (UTC)
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  tsan-nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain info
        run: c++ --version

      - name: Atomic I/O close protocols under TSan
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libuv1-dev liburing-dev pkg-config
          cmake -S . -B build-io-tsan -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS='-fsanitize=thread -fno-omit-frame-pointer' \
            -DFLUX_FOUNDRY_ENABLE_UV_EXECUTOR=ON -DFLUX_FOUNDRY_ENABLE_IO_URING=ON
          cmake --build build-io-tsan --parallel 2 --target \
            flux_foundry_uv_executor_contract flux_foundry_uv_executor_contract_noexc \
            flux_foundry_io_uring_attachment_contract flux_foundry_io_uring_attachment_contract_noexc \
            flux_foundry_identity_pool_contract flux_foundry_identity_pool_contract_noexc \
            flux_foundry_identity_pool_pipeline flux_foundry_identity_pool_pipeline_noexc
          TSAN_OPTIONS='halt_on_error=1 exitcode=66' \
            ctest --test-dir build-io-tsan -R '^(uv_executor_contract.*|io_uring_attachment_contract.*|identity_pool_(contract|pipeline).*)$' --output-on-failure --timeout 120

      - name: Build TSAN probes
        run: |
          set -euo pipefail
          mkdir -p /tmp/flux_foundry_tsan
          c++ -std=c++14 -O1 -g -fno-omit-frame-pointer -I. test/flow_controller_memorder_stress.cpp \
            -o /tmp/flux_foundry_tsan/flow_controller_memorder_stress_tsan -pthread -fsanitize=thread
          c++ -std=c++14 -O1 -g -fno-omit-frame-pointer -I. test/flow_state_multiflow_cancel_simple_executor_stress.cpp \
            -o /tmp/flux_foundry_tsan/flow_state_multiflow_cancel_simple_executor_stress_tsan -pthread -fsanitize=thread
          c++ -std=c++14 -O1 -g -fno-omit-frame-pointer -I. test/flow_state_stress.cpp \
            -o /tmp/flux_foundry_tsan/flow_state_stress_tsan -pthread -fsanitize=thread
          c++ -std=c++14 -O1 -g -fno-omit-frame-pointer -I. test/hazard_ptr_contract.cpp \
            -o /tmp/flux_foundry_tsan/hazard_ptr_contract_tsan -pthread -fsanitize=thread
          c++ -std=c++14 -O1 -g -fno-omit-frame-pointer -I. test/hazard_ptr_stack_stress.cpp \
            -o /tmp/flux_foundry_tsan/hazard_ptr_stack_stress_tsan -pthread -fsanitize=thread

      - name: Deterministic lifecycle under TSAN
        run: |
          c++ -std=c++14 -O1 -g -fno-omit-frame-pointer -I. test/awaitable_lifecycle_contract.cpp -o /tmp/flux_foundry_tsan/lifecycle -pthread -fsanitize=thread
          TSAN_OPTIONS='halt_on_error=1 exitcode=66' timeout 30 /tmp/flux_foundry_tsan/lifecycle

      - name: Pipeline lifetime handoffs under TSAN
        run: |
          set -euo pipefail
          mkdir -p /tmp/flux_foundry_tsan_logs
          export TSAN_OPTIONS='halt_on_error=1 exitcode=66'
          for enabled in 0 1; do
            c++ -std=c++14 -O1 -g -fno-omit-frame-pointer -I. \
              -DFLUX_FOUNDRY_ENABLE_VACCINE=$enabled test/pipeline_lifetime_contract.cpp \
              -o /tmp/flux_foundry_tsan/pipeline_lifetime_$enabled -pthread -fsanitize=thread
            timeout 300 /tmp/flux_foundry_tsan/pipeline_lifetime_$enabled 20 \
              > /tmp/flux_foundry_tsan_logs/pipeline_lifetime_$enabled.log 2>&1 || {
                cat /tmp/flux_foundry_tsan_logs/pipeline_lifetime_$enabled.log
                exit 1
              }
          done

      - name: Run nightly TSAN regressions
        run: |
          set -euo pipefail
          mkdir -p /tmp/flux_foundry_tsan_logs
          export TSAN_OPTIONS='halt_on_error=1 exitcode=66'

          echo "[nightly] flow_controller_memorder_stress x1000"
          for i in $(seq 1 1000); do
            /tmp/flux_foundry_tsan/flow_controller_memorder_stress_tsan 5 5 5 5 > /tmp/flux_foundry_tsan_logs/memorder.log 2>&1 || {
              echo "FAIL: memorder round $i"
              cat /tmp/flux_foundry_tsan_logs/memorder.log
              exit 1
            }
            if (( i % 100 == 0 )); then echo "PASS memorder: $i/1000"; fi
          done

          echo "[nightly] multiflow simple_executor cancel stress x100"
          for i in $(seq 1 100); do
            /tmp/flux_foundry_tsan/flow_state_multiflow_cancel_simple_executor_stress_tsan 8 200 4 4 500 > /tmp/flux_foundry_tsan_logs/multiflow_simple.log 2>&1 || {
              echo "FAIL: multiflow simple round $i"
              cat /tmp/flux_foundry_tsan_logs/multiflow_simple.log
              exit 1
            }
            if (( i % 20 == 0 )); then echo "PASS multiflow-simple: $i/100"; fi
          done

          echo "[nightly] flow_state_stress x50"
          for i in $(seq 1 50); do
            /tmp/flux_foundry_tsan/flow_state_stress_tsan > /tmp/flux_foundry_tsan_logs/flow_state.log 2>&1 || {
              echo "FAIL: flow_state_stress round $i"
              cat /tmp/flux_foundry_tsan_logs/flow_state.log
              exit 1
            }
            if (( i % 10 == 0 )); then echo "PASS flow_state_stress: $i/50"; fi
          done

          echo "[nightly] hazard_ptr slot handoff x20"
          for i in $(seq 1 20); do
            /tmp/flux_foundry_tsan/hazard_ptr_contract_tsan > /tmp/flux_foundry_tsan_logs/hazard_contract.log 2>&1 || {
              echo "FAIL: hazard_ptr contract round $i"
              cat /tmp/flux_foundry_tsan_logs/hazard_contract.log
              exit 1
            }
          done

          echo "[nightly] hazard_ptr Treiber stack x10"
          for i in $(seq 1 10); do
            /tmp/flux_foundry_tsan/hazard_ptr_stack_stress_tsan 4 4 5000 > /tmp/flux_foundry_tsan_logs/hazard_stack.log 2>&1 || {
              echo "FAIL: hazard_ptr stack round $i"
              cat /tmp/flux_foundry_tsan_logs/hazard_stack.log
              exit 1
            }
          done

          echo "TSAN nightly: PASS"

      - name: Poison contracts under TSAN
        run: |
          for enabled in 0 1; do
            c++ -std=c++14 -O1 -g -fno-omit-frame-pointer -I. test/poison_contract.cpp \
              -DFLUX_FOUNDRY_ENABLE_POISON=$enabled -pthread -fsanitize=thread \
              -o /tmp/flux_foundry_tsan/poison_$enabled
            TSAN_OPTIONS='halt_on_error=1 exitcode=66' timeout 30 /tmp/flux_foundry_tsan/poison_$enabled
          done

      - name: Upload TSAN logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tsan-nightly-logs
          path: /tmp/flux_foundry_tsan_logs
